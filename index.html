<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 font-sans overflow-hidden">
    <div class="fixed top-0 -left-20 w-72 h-72 bg-purple-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="fixed bottom-0 -right-20 w-72 h-72 bg-indigo-600 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

    <div class="relative max-w-2xl w-full">
        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl blur opacity-30 group-hover:opacity-50 transition duration-1000"></div>
            
            <div class="relative bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl overflow-hidden">
                <div class="p-8 text-center bg-gradient-to-b from-slate-800/50 to-transparent">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-indigo-600 to-purple-500 rounded-2xl mb-4 rotate-3 shadow-xl">
                        <i class="fas fa-brain text-white text-4xl"></i>
                    </div>
                    <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-300 mb-2">
                        ATLAS <span class="text-emerald-400">AI</span>
                    </h1>
                    <p class="text-slate-400 font-medium">L'IA marocaine qui donne vie à vos idées</p>
                </div>

                <div class="p-8 space-y-6">
                    <div class="relative">
                        <input type="text" id="prompt" 
                            class="w-full bg-slate-950/50 border-2 border-slate-800 rounded-2xl py-5 px-6 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all shadow-inner"
                            placeholder="Pose-moi une question en Français ou en Darija...">
                        
                        <button onclick="envoyer()" 
                            class="mt-4 w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/25 transform active:scale-95 transition-all flex items-center justify-center gap-3">
                            <span>Lancer l'intelligence</span>
                            <i class="fas fa-bolt"></i>
                        </button>
                    </div>

                    <div id="loader" class="hidden py-10 text-center">
                        <div class="inline-flex gap-2">
                            <span class="w-3 h-3 bg-indigo-500 rounded-full animate-bounce"></span>
                            <span class="w-3 h-3 bg-purple-500 rounded-full animate-bounce [animation-delay:-0.15s]"></span>
                            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-bounce [animation-delay:-0.3s]"></span>
                        </div>
                    </div>

                    <div id="resultat-container" class="hidden transform transition-all">
                        <div class="bg-slate-800/40 rounded-2xl p-6 border-l-4 border-emerald-500">
                            <div class="flex items-center gap-2 mb-4 text-emerald-400 font-bold text-xs uppercase tracking-widest">
                                <i class="fas fa-magic"></i> Réponse d'Atlas
                            </div>
                            <div id="resultat" class="text-slate-200 leading-relaxed text-lg whitespace-pre-line"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
    </style>
</body>
